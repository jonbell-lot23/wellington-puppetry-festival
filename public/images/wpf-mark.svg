  <rect x="30" y="73" width="7" height="21" rx="3.5"/>
  <!-- Ring finger -->
  <rect x="39" y="67" width="7" height="27" rx="3.5"/>
  <!-- Middle finger -->
  <rect x="48" y="65" width="7" height="29" rx="3.5"/>
  <!-- Index finger -->
  <rect x="57" y="67" width="7" height="27" rx="3.5"/>
  <!-- Thumb -->
  <path d="M30 88 C22 84 20 73 27 71 C32 70 30 80 30 88Z"/>
  <!-- Palm -->
  <path d="M30 94 C30 110 67 110 67 94 L67 91 L30 91Z"/>
  <!-- Wrist -->
