<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" fill="#5ec20f">
  <!-- Bird: wings spread, body, head, tail -->
  <!-- Left wing -->
  <path d="M47 26 C38 20 18 23 5 14 C16 25 34 26 45 31Z"/>
  <!-- Right wing -->
  <path d="M53 26 C62 20 82 23 95 14 C84 25 66 26 55 31Z"/>
  <!-- Body -->
  <ellipse cx="50" cy="33" rx="7" ry="10"/>
  <!-- Head -->
  <circle cx="56" cy="22" r="6"/>
  <!-- Beak -->
  <polygon points="62,21 72,20 62,25"/>
  <!-- Tail feathers -->
  <path d="M44 42 L38 55 L43 44 L50 57 L57 44 L62 55 L56 42Z"/>

  <!-- Puppet string -->
